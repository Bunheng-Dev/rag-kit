services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-kit-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    networks:
      - rag-kit-network

  cloudflared:
    profiles: ["cloud"]
    image: cloudflare/cloudflared:latest
    container_name: rag-kit-tunnel
    restart: unless-stopped
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: http2
    command: tunnel run --token ${CLOUDFLARE_TOKEN:-}
    networks:
      - rag-kit-network

  qdrant:
    profiles: ["selfhost"]
    image: qdrant/qdrant:latest
    container_name: rag-kit-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag-kit-network

  mysql-test:
    profiles: ["mysql-test"]
    image: mysql:8
    container_name: rag-kit-mysql-test
    restart: "no"
    environment:
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-rag_kit}
      MYSQL_USER: ${MYSQL_TEST_USER:-rag_kit}
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:-rag_kit_pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:-rag_kit_root_pw}
    ports:
      - "${MYSQL_TEST_HOST_PORT:-3307}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - rag-kit-network

networks:
  rag-kit-network:
    driver: bridge

volumes:
  qdrant_data:
