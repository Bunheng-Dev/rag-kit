[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kit"
version = "0.2.0"
description = "A provider-agnostic FastAPI retrieval-augmented generation toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "qdrant-client>=1.14.0",
  "google-genai>=0.1.1",
  "pymysql>=1.1.0",
  "slowapi>=0.1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["app*"]
